# Despliegue a GitHub Pages: npm ci → npm run build → publicar dist/
# Requisito en el repo: Settings → Pages → Source = "GitHub Actions"

name: Deploy MedNode to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Astro 6 requiere >=22.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build Astro (genera dist/)
        run: npm run build

      - name: Comprobar artefacto de build
        run: |
          test -f dist/index.html
          test -f dist/es/index.html
          test -f dist/ca/index.html
          test -f dist/CNAME
          echo "Build OK: $(find dist -name 'index.html' | wc -l) páginas"

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
